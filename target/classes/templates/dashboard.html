<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Dashboard - Student Management')}"></head>
<body>
    <div th:replace="~{layout :: sidebar('dashboard')}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold m-0">Student Information & Academic Performance Dashboard</h3>
                <p class="text-muted small">Single Monolithic System Overview</p>
            </div>
        </div>

        <!-- Metric Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 border-start border-4 border-primary p-3">
                    <small class="text-uppercase text-muted fw-bold">Total Students</small>
                    <h3 class="fw-bold mt-2 mb-0" th:text="${#lists.size(students)}">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0 border-start border-4 border-success p-3">
                    <small class="text-uppercase text-muted fw-bold">Active Attendance Tracks</small>
                    <h3 class="fw-bold mt-2 mb-0">Active</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0 border-start border-4 border-info p-3">
                    <small class="text-uppercase text-muted fw-bold">Academic Result Records</small>
                    <h3 class="fw-bold mt-2 mb-0">Published</h3>
                </div>
            </div>
        </div>

        <!-- Student Roster Table -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h5 class="fw-bold m-0"><i class="fa-solid fa-users me-2 text-primary"></i>Student Directory</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Roll Number</th>
                                <th>Student Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Academic Year</th>
                                <th>Phone</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${students}">
                                <td><span class="badge bg-secondary" th:text="${s.rollNumber}">Roll</span></td>
                                <td class="fw-bold" th:text="${s.name}">Name</td>
                                <td th:text="${s.email}">Email</td>
                                <td th:text="${s.department}">Department</td>
                                <td th:text="${s.academicYear}">Year</td>
                                <td th:text="${s.phone}">Phone</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
