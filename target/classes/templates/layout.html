<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Student Information & Academic Performance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .sidebar { width: 250px; position: fixed; top: 0; bottom: 0; left: 0; background-color: #212529; color: white; padding-top: 1rem; }
        .main-content { margin-left: 250px; padding: 2rem; }
        .nav-link { color: #adb5bd; padding: 0.75rem 1.25rem; }
        .nav-link:hover, .nav-link.active { color: white; background-color: #343a40; }
    </style>
</head>
<body>
    <div th:fragment="sidebar(activeTab)">
        <div class="sidebar">
            <div class="px-3 mb-4">
                <h4><i class="fa-solid fa-graduation-cap text-primary me-2"></i>Student Portal</h4>
                <small class="text-muted">Academic Management</small>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="/" class="nav-link" th:classappend="${activeTab == 'dashboard' ? 'active' : ''}">
                        <i class="fa-solid fa-gauge me-2"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/login" class="nav-link text-danger mt-4">
                        <i class="fa-solid fa-right-from-bracket me-2"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
