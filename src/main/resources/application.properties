# ==========================================
# SRTO - Smart Resource & Timetable Optimization
# Application Configuration
# ==========================================

spring.application.name=srto
server.port=8080

# Database Configuration (H2 In-Memory with H2 Console enabled by default for easy STS testing)
spring.datasource.url=jdbc:h2:mem:srtodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (Uncomment for Production / MySQL Server)
# spring.datasource.url=jdbc:mysql://localhost:3306/srto_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# For MySQL uncomment line below:
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Logging
logging.level.com.srto=INFO
logging.level.org.springframework.security=WARN
