<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('SRTO - Subjects')}"></head>
<body>
    <div th:replace="~{layout :: sidebar('subjects')}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Subject & Module Management</h2>
                <p class="text-muted small">Curriculum Subjects, Lab Requirements & Credit Allocation</p>
            </div>
        </div>

        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-plus text-info me-2"></i>Add Subject</h5>
                    <form th:action="@{/subjects/add}" method="post" th:object="${newSubject}">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Subject Code</label>
                            <input type="text" th:field="*{code}" class="form-control bg-dark text-light border-secondary" placeholder="CS301" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Subject Name</label>
                            <input type="text" th:field="*{name}" class="form-control bg-dark text-light border-secondary" placeholder="Data Structures" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Department</label>
                            <select th:field="*{department.id}" class="form-select bg-dark text-light border-secondary">
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small">Credits</label>
                                <input type="number" th:field="*{credits}" class="form-control bg-dark text-light border-secondary" value="4">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small">Weekly Hrs</label>
                                <input type="number" th:field="*{weeklyHours}" class="form-control bg-dark text-light border-secondary" value="4">
                            </div>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" th:field="*{isLab}" id="isLabCheck">
                            <label class="form-check-label text-muted small" for="isLabCheck">
                                Requires Practical Lab Room
                            </label>
                        </div>
                        <button type="submit" class="btn btn-info fw-bold w-100">Save Subject</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-book text-info me-2"></i>Academic Subjects</h5>
                    <div class="table-responsive">
                        <table class="table table-dark-custom align-middle">
                            <thead>
                                <tr class="text-muted small">
                                    <th>Code</th>
                                    <th>Subject Name</th>
                                    <th>Department</th>
                                    <th>Credits</th>
                                    <th>Weekly Hours</th>
                                    <th>Type</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${subjects}">
                                    <td><span class="badge bg-secondary" th:text="${s.code}">CS301</span></td>
                                    <td class="fw-semibold" th:text="${s.name}">Data Structures</td>
                                    <td th:text="${s.department != null ? s.department.code : 'N/A'}">CSE</td>
                                    <td th:text="${s.credits}">4</td>
                                    <td th:text="${s.weeklyHours + ' hrs'}">4 hrs</td>
                                    <td>
                                        <span th:if="${s.isLab}" class="badge bg-warning text-dark"><i class="fa-solid fa-flask me-1"></i>Lab</span>
                                        <span th:unless="${s.isLab}" class="badge bg-info text-dark">Theory</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
