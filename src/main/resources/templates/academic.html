<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('SRTO - Academic Structure')}"></head>
<body>
    <div th:replace="~{layout :: sidebar('academic')}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Academic Structure & Student Batches</h2>
                <p class="text-muted small">Academic Years, Active Semesters & Section Batches</p>
            </div>
        </div>

        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4 mb-4">
            <!-- Academic Years -->
            <div class="col-md-6">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-calendar text-info me-2"></i>Academic Years</h5>
                    <ul class="list-group list-group-flush bg-transparent">
                        <li th:each="y : ${academicYears}" class="list-group-item bg-transparent text-light border-secondary d-flex justify-content-between align-items-center">
                            <span class="fw-semibold" th:text="${y.yearName}">2025-2026</span>
                            <span th:if="${y.isCurrent}" class="badge bg-success">Active Session</span>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Semesters -->
            <div class="col-md-6">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-layer-group text-info me-2"></i>Semesters</h5>
                    <ul class="list-group list-group-flush bg-transparent">
                        <li th:each="s : ${semesters}" class="list-group-item bg-transparent text-light border-secondary d-flex justify-content-between align-items-center">
                            <span class="fw-semibold" th:text="${s.name}">Semester 3</span>
                            <small class="text-muted" th:text="${'Academic Year: ' + s.academicYear.yearName}">Year</small>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Student Batches section -->
        <div class="row g-4">
            <div class="col-md-4">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-plus text-info me-2"></i>Add Student Batch</h5>
                    <form th:action="@{/academic/batch/add}" method="post" th:object="${newBatch}">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Batch Code / Name</label>
                            <input type="text" th:field="*{batchName}" class="form-control bg-dark text-light border-secondary" placeholder="CSE-2025-SecA" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Student Count</label>
                            <input type="number" th:field="*{studentCount}" class="form-control bg-dark text-light border-secondary" value="60">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Course</label>
                            <select th:field="*{course.id}" class="form-select bg-dark text-light border-secondary">
                                <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Semester</label>
                            <select th:field="*{semester.id}" class="form-select bg-dark text-light border-secondary">
                                <option th:each="s : ${semesters}" th:value="${s.id}" th:text="${s.name}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-info fw-bold w-100">Create Batch</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-users text-info me-2"></i>Active Student Batches</h5>
                    <div class="table-responsive">
                        <table class="table table-dark-custom align-middle">
                            <thead>
                                <tr class="text-muted small">
                                    <th>Batch Name</th>
                                    <th>Course</th>
                                    <th>Semester</th>
                                    <th>Students</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="b : ${batches}">
                                    <td><span class="badge bg-secondary" th:text="${b.batchName}">CSE-A</span></td>
                                    <td class="fw-semibold" th:text="${b.course != null ? b.course.name : 'N/A'}">Course</td>
                                    <td th:text="${b.semester != null ? b.semester.name : 'N/A'}">Sem 3</td>
                                    <td th:text="${b.studentCount + ' Students'}">60</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
