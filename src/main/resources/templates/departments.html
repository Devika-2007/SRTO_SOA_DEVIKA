<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('SRTO - Departments')}"></head>
<body>
    <div th:replace="~{layout :: sidebar('departments')}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Department Management</h2>
                <p class="text-muted small">Manage Academic Departments & Leadership</p>
            </div>
        </div>

        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-plus text-info me-2"></i>Add Department</h5>
                    <form th:action="@{/departments/add}" method="post" th:object="${newDepartment}">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Dept Code</label>
                            <input type="text" th:field="*{code}" class="form-control bg-dark text-light border-secondary" placeholder="e.g. CSE" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Department Name</label>
                            <input type="text" th:field="*{name}" class="form-control bg-dark text-light border-secondary" placeholder="e.g. Computer Science" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Head of Department (HOD)</label>
                            <input type="text" th:field="*{headOfDepartment}" class="form-control bg-dark text-light border-secondary" placeholder="e.g. Dr. Vance">
                        </div>
                        <button type="submit" class="btn btn-info fw-bold w-100">Save Department</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-building-columns text-info me-2"></i>Existing Departments</h5>
                    <div class="table-responsive">
                        <table class="table table-dark-custom align-middle">
                            <thead>
                                <tr class="text-muted small">
                                    <th>Code</th>
                                    <th>Name</th>
                                    <th>Head of Dept</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="d : ${departments}">
                                    <td><span class="badge bg-info text-dark" th:text="${d.code}">CSE</span></td>
                                    <td class="fw-semibold" th:text="${d.name}">Computer Science</td>
                                    <td th:text="${d.headOfDepartment}">Dr. Vance</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
