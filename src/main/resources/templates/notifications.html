<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('SRTO - Notifications')}"></head>
<body>
    <div th:replace="~{layout :: sidebar('notifications')}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">System Notifications & Alerts</h2>
                <p class="text-muted small">Real-time Timetable Broadcasts & Audit Logs</p>
            </div>
        </div>

        <div class="glass-card">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-bell text-warning me-2"></i>Notification Feed</h5>
            <div class="list-group list-group-flush bg-transparent">
                <div th:each="n : ${notifications}" class="list-group-item bg-transparent text-light border-secondary py-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h6 class="fw-bold text-info mb-1" th:text="${n.title}">Notification Title</h6>
                        <small class="text-muted" th:text="${#temporals.format(n.timestamp, 'yyyy-MM-dd HH:mm')}">2025-10-24 12:00</small>
                    </div>
                    <p class="text-muted mb-1" th:text="${n.message}">Body message text...</p>
                    <span class="badge bg-secondary" th:text="${'Audience: ' + n.targetRole}">ALL</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
