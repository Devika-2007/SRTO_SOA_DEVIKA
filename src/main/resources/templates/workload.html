<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('SRTO - Faculty Workload')}"></head>
<body>
    <div th:replace="~{layout :: sidebar('workload')}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Faculty Workload Management</h2>
                <p class="text-muted small">Monitor Weekly Teaching Hours & Allocation Limits</p>
            </div>
        </div>

        <div class="glass-card">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-sliders me-2 text-info"></i>Faculty Teaching Hours</h5>
            <div class="table-responsive">
                <table class="table table-dark-custom align-middle">
                    <thead>
                        <tr class="text-muted small">
                            <th>Employee ID</th>
                            <th>Faculty Name</th>
                            <th>Designation</th>
                            <th>Department</th>
                            <th>Weekly Workload Progress</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="f : ${faculties}">
                            <td class="fw-bold text-info" th:text="${f.employeeId}">FAC001</td>
                            <td th:text="${f.name}">Prof. Alan Turing</td>
                            <td th:text="${f.designation}">Associate Professor</td>
                            <td th:text="${f.department != null ? f.department.code : 'N/A'}">CSE</td>
                            <td style="width: 30%;">
                                <div class="d-flex justify-content-between small mb-1">
                                    <span th:text="${f.currentAssignedHours + ' / ' + f.maxWeeklyHours + ' hrs'}">4 / 20 hrs</span>
                                    <span th:text="${(f.currentAssignedHours * 100 / (f.maxWeeklyHours > 0 ? f.maxWeeklyHours : 1)) + '%'}">20%</span>
                                </div>
                                <div class="progress bg-dark" style="height: 8px;">
                                    <div class="progress-bar bg-info" role="progressbar" 
                                         th:style="'width: ' + ${(f.currentAssignedHours * 100 / (f.maxWeeklyHours > 0 ? f.maxWeeklyHours : 1))} + '%'"></div>
                                </div>
                            </td>
                            <td>
                                <span th:if="${f.currentAssignedHours <= f.maxWeeklyHours}" class="badge bg-success">Optimal</span>
                                <span th:if="${f.currentAssignedHours > f.maxWeeklyHours}" class="badge bg-danger">Overloaded</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
