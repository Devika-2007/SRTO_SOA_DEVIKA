<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Login - Student Management')}"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="card shadow p-4" style="width: 380px; border-radius: 12px;">
        <div class="text-center mb-4">
            <i class="fa-solid fa-graduation-cap fa-3x text-primary mb-2"></i>
            <h4 class="fw-bold">Student Portal Login</h4>
            <p class="text-muted small">Academic Performance & Information System</p>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label text-muted small">Username</label>
                <input type="text" name="username" class="form-control" placeholder="admin" value="admin" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small">Password</label>
                <input type="password" name="password" class="form-control" placeholder="admin123" value="admin123" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Sign In</button>
        </form>

        <div class="mt-4 text-center">
            <small class="text-muted">Default credentials: <code>admin</code> / <code>admin123</code></small>
        </div>
    </div>
</body>
</html>
