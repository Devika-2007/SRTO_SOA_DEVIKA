<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('SRTO - Settings')}"></head>
<body>
    <div th:replace="~{layout :: sidebar('settings')}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">System Settings</h2>
                <p class="text-muted small">Global Institutional Configuration</p>
            </div>
        </div>

        <div class="glass-card">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-sliders text-info me-2"></i>Global Parameters</h5>
            <div class="table-responsive">
                <table class="table table-dark-custom align-middle">
                    <thead>
                        <tr class="text-muted small">
                            <th>Setting Key</th>
                            <th>Value</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${settings}">
                            <td><span class="badge bg-secondary" th:text="${s.keyName}">KEY</span></td>
                            <td class="fw-bold text-info" th:text="${s.keyValue}">Value</td>
                            <td class="text-muted" th:text="${s.description}">Description</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
