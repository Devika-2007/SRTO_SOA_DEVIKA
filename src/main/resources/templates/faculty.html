<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('SRTO - Faculty')}"></head>
<body>
    <div th:replace="~{layout :: sidebar('faculty')}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Faculty Directory</h2>
                <p class="text-muted small">Manage Teaching Staff & Workload Capacity</p>
            </div>
        </div>

        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-plus text-info me-2"></i>Add Faculty Member</h5>
                    <form th:action="@{/faculty/add}" method="post" th:object="${newFaculty}">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Employee ID</label>
                            <input type="text" th:field="*{employeeId}" class="form-control bg-dark text-light border-secondary" placeholder="FAC003" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control bg-dark text-light border-secondary" placeholder="Prof. Jane Doe" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control bg-dark text-light border-secondary" placeholder="jane@srto.edu" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Designation</label>
                            <input type="text" th:field="*{designation}" class="form-control bg-dark text-light border-secondary" placeholder="Assistant Professor">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Department</label>
                            <select th:field="*{department.id}" class="form-select bg-dark text-light border-secondary">
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Max Weekly Teaching Hours</label>
                            <input type="number" th:field="*{maxWeeklyHours}" class="form-control bg-dark text-light border-secondary" value="20">
                        </div>
                        <button type="submit" class="btn btn-info fw-bold w-100">Save Faculty</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-chalkboard-user text-info me-2"></i>Faculty Roster</h5>
                    <div class="table-responsive">
                        <table class="table table-dark-custom align-middle">
                            <thead>
                                <tr class="text-muted small">
                                    <th>Emp ID</th>
                                    <th>Name</th>
                                    <th>Designation</th>
                                    <th>Department</th>
                                    <th>Max Hrs</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="f : ${faculties}">
                                    <td><span class="badge bg-secondary" th:text="${f.employeeId}">FAC001</span></td>
                                    <td class="fw-semibold" th:text="${f.name}">Prof. Turing</td>
                                    <td th:text="${f.designation}">Professor</td>
                                    <td th:text="${f.department != null ? f.department.code : 'N/A'}">CSE</td>
                                    <td th:text="${f.maxWeeklyHours + ' hrs/wk'}">20 hrs/wk</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
