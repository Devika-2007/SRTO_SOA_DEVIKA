<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('SRTO - Server Error')}"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="glass-card text-center" style="max-width: 500px;">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h4 class="fw-bold mb-3">Internal System Exception</h4>
        <p class="text-muted small mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected exception occurred while processing your timetable request.'}">
            Server error.
        </p>
        <a href="/dashboard" class="btn btn-info fw-bold"><i class="fa-solid fa-house me-2"></i>Return to Dashboard</a>
    </div>
</body>
</html>
