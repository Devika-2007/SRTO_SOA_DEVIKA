<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('SRTO - Classrooms & Labs')}"></head>
<body>
    <div th:replace="~{layout :: sidebar('classrooms')}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Classroom & Lab Management</h2>
                <p class="text-muted small">Physical Infrastructure, Room Capacity & Equipment</p>
            </div>
        </div>

        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-plus text-info me-2"></i>Register Room / Lab</h5>
                    <form th:action="@{/classrooms/add}" method="post" th:object="${newClassroom}">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Room / Lab Number</label>
                            <input type="text" th:field="*{roomNumber}" class="form-control bg-dark text-light border-secondary" placeholder="LH-101" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Building Block</label>
                            <input type="text" th:field="*{building}" class="form-control bg-dark text-light border-secondary" placeholder="Academic Block A" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Seating Capacity</label>
                            <input type="number" th:field="*{capacity}" class="form-control bg-dark text-light border-secondary" value="60">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Equipment & Amenities</label>
                            <input type="text" th:field="*{equipment}" class="form-control bg-dark text-light border-secondary" placeholder="Projector, Smartboard, AC">
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" th:field="*{isLab}" id="isLabRoom">
                            <label class="form-check-label text-muted small" for="isLabRoom">
                                Is Practical Lab Facility
                            </label>
                        </div>
                        <button type="submit" class="btn btn-info fw-bold w-100">Register Room</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-door-open text-info me-2"></i>Infrastructure Directory</h5>
                    <div class="table-responsive">
                        <table class="table table-dark-custom align-middle">
                            <thead>
                                <tr class="text-muted small">
                                    <th>Room No</th>
                                    <th>Building</th>
                                    <th>Capacity</th>
                                    <th>Type</th>
                                    <th>Equipment</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${classrooms}">
                                    <td><span class="badge bg-secondary" th:text="${c.roomNumber}">LH-101</span></td>
                                    <td th:text="${c.building}">Block A</td>
                                    <td th:text="${c.capacity + ' Seats'}">60 Seats</td>
                                    <td>
                                        <span th:if="${c.isLab}" class="badge bg-warning text-dark">Laboratory</span>
                                        <span th:unless="${c.isLab}" class="badge bg-info text-dark">Lecture Hall</span>
                                    </td>
                                    <td class="small text-muted" th:text="${c.equipment}">Projector, AC</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
