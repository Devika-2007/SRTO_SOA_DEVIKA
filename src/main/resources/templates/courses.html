<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('SRTO - Courses')}"></head>
<body>
    <div th:replace="~{layout :: sidebar('courses')}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Course Management</h2>
                <p class="text-muted small">Degree Programs & Curriculum Structure</p>
            </div>
        </div>

        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-plus text-info me-2"></i>Add Course</h5>
                    <form th:action="@{/courses/add}" method="post" th:object="${newCourse}">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Course Code</label>
                            <input type="text" th:field="*{code}" class="form-control bg-dark text-light border-secondary" placeholder="BTECH-CSE" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Course Name</label>
                            <input type="text" th:field="*{name}" class="form-control bg-dark text-light border-secondary" placeholder="B.Tech Computer Science" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Department</label>
                            <select th:field="*{department.id}" class="form-select bg-dark text-light border-secondary">
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Duration (Years)</label>
                            <input type="number" th:field="*{durationYears}" class="form-control bg-dark text-light border-secondary" value="4">
                        </div>
                        <button type="submit" class="btn btn-info fw-bold w-100">Save Course</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-graduation-cap text-info me-2"></i>Registered Courses</h5>
                    <div class="table-responsive">
                        <table class="table table-dark-custom align-middle">
                            <thead>
                                <tr class="text-muted small">
                                    <th>Code</th>
                                    <th>Course Name</th>
                                    <th>Department</th>
                                    <th>Duration</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${courses}">
                                    <td><span class="badge bg-secondary" th:text="${c.code}">CODE</span></td>
                                    <td class="fw-semibold" th:text="${c.name}">Name</td>
                                    <td th:text="${c.department != null ? c.department.name : 'N/A'}">Dept</td>
                                    <td th:text="${c.durationYears + ' Years'}">4 Years</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
